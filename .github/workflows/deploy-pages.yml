name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Preparar HTML legado do Blogger
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/prepare_blogger_html.py --baseurl "$PAGES_BASE_PATH" --expect 194

      - name: Build Jekyll para Pages
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --trace --baseurl "$PAGES_BASE_PATH"

      - name: Validar caminhos e HTML da publicação
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/assets/css/style.css
          test -f _site/assets/css/content.css
          test -f _site/assets/js/site.js
          test -f _site/2026/02/espanol-entre-paginas-01-pedro-paramo.html
          grep -F "href=\"${PAGES_BASE_PATH}/assets/css/style.css\"" _site/index.html
          grep -F "src=\"${PAGES_BASE_PATH}/assets/js/site.js\"" _site/index.html
          grep -F '<iframe' _site/2026/02/espanol-entre-paginas-01-pedro-paramo.html
          grep -F 'youtube.com/embed/pdhJ50G0rjs' _site/2026/02/espanol-entre-paginas-01-pedro-paramo.html
          python3 scripts/prepare_blogger_html.py --validate-site _site --expect-posts 189

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
