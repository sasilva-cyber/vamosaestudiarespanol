name: Importar acervo do Blogger

on:
  push:
    branches:
      - feat/blog-profissional
    paths:
      - migration/IMPORT_READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar conversor
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Buscar e converter o Blogger
        run: python scripts/import_blogger.py

      - name: Validar totais contra o backup auditado
        shell: bash
        run: |
          set -euo pipefail
          test "$(find _posts -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 189
          test "$(find p -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 5
          test -f migration/migration-manifest.json

      - name: Ajustar arquivos de transição
        shell: bash
        run: |
          set -euo pipefail
          rm -f migration/IMPORT_READY

      - name: Commitar acervo convertido
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi
          git commit -m "import: migra 189 posts e 5 paginas do Blogger"
          git push origin HEAD:feat/blog-profissional
