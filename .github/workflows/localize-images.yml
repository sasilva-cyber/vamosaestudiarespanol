name: Internalizar imagens do Blogger

on:
  push:
    branches:
      - feat/blog-profissional
    paths:
      - migration/LOCALIZE_IMAGES
  workflow_dispatch:

permissions:
  contents: write

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependências
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pillow

      - name: Baixar e otimizar imagens
        run: python scripts/localize_images.py

      - name: Remover marcador
        run: rm -f migration/LOCALIZE_IMAGES

      - name: Commitar mídias locais
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi
          git commit -m "assets: internaliza e otimiza imagens do Blogger"
          git push origin HEAD:feat/blog-profissional
