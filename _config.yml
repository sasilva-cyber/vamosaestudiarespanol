title: "Vamos a Estudiar Español"
tagline: "¡Aprende, practica y avanza!"
description: "Conteúdos, cultura, gramática, vocabulário e recursos para aprender espanhol."
url: "https://vamosaestudiarespanol.com.br"
baseurl: ""
lang: "pt-BR"
timezone: "America/Sao_Paulo"
encoding: "utf-8"

# Mantém o padrão histórico do Blogger: /ano/mês/slug.html
permalink: /:year/:month/:title.html

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# O acervo importado do Blogger contém HTML legado, inclusive combinações
# antigas de tags inline e de bloco. Impedimos o Kramdown de reinterpretar
# esse HTML para preservar a marcação original em vez de exibi-la como texto.
kramdown:
  parse_block_html: false
  parse_span_html: false

feed:
  path: feed.xml

social:
  instagram: "https://www.instagram.com/vamosaestudiarespanol"
  facebook: "https://www.facebook.com/vamosaestudiarespanol"
  youtube: "https://www.youtube.com/@vamosaestudiarespanol"
  practice: "https://pratica.vamosaestudiarespanol.com.br/"

youtube_latest_api: "https://clfwoywzalttkvhstsgh.supabase.co/functions/v1/youtube-latest"

# Credenciais públicas de baixo privilégio para os RPCs de popularidade.
# A chave publishable é própria para clientes web; nunca usar service_role aqui.
supabase_url: "https://clfwoywzalttkvhstsgh.supabase.co"
supabase_publishable_key: "sb_publishable_QylDT7fw_RktIiSApbHkLA_w6PHRjmH"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Vamos a Estudiar Español"
      image: ""
      popular: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
