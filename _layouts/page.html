---
layout: default
---
<article class="page-article">
  <header class="page-header">
    <p class="eyebrow">Vamos a Estudiar Español</p>
    <h1>{{ page.title }}</h1>
    {% if page.description and page.description != page.title %}
    <p class="post-lead">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-body page-body">
    {{ content }}
  </div>
</article>
